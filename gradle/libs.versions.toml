navigation = "2.8.5"
room = "2.6.1"
coroutines = "1.9.0"
datastore = "1.1.1"
appcompat = "1.7.0"
exifinterface = "1.3.7"
biometric = "1.1.0"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"
hilt = "2.52"
